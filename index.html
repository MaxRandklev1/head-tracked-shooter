<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Head-Tracked Shooter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Consolas, monospace; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #status { position: fixed; left: 10px; bottom: 10px; color: #9fd; font-size: 12px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
      #preview { position: fixed; left: 10px; bottom: 44px; width: 280px; border-radius: 6px; background: #111; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" playsinline muted class="hidden"></video>
    <canvas id="preview" class="hidden"></canvas>
    <div id="status"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
